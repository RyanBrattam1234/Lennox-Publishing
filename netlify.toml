[build]
  base = "frontend"
  publish = "."
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/pwa.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pwa.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/api/*"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/blog/:splat"
  status = 200
  force = true

[[headers]]
  for = "/blog-creator/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/impressum*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/datenschutz*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/impressum"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/impressum"
  status = 200
  force = true

[[redirects]]
  from = "/impressum.html"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/impressum"
  status = 200
  force = true

[[redirects]]
  from = "/datenschutz"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/datenschutz"
  status = 200
  force = true

[[redirects]]
  from = "/datenschutz.html"
  to = "https://lennox-publishing-neugestaltung.cleanrowan2.chatgpt.site/datenschutz"
  status = 200
  force = true

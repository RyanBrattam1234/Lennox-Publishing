<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Verwaltung · Lennox Publishing</title><link rel="stylesheet" href="/verwaltung/admin.css"><script type="module" src="/verwaltung/admin.js"></script></head><body>
<header class="mast"><div class="mast-inner"><a class="brand" href="/"><img src="/assets/icons/icon-192.png" width="38" height="38" alt="">Lennox Publishing</a><div class="mast-actions"><a href="/" class="site-link">Zur Website <span aria-hidden="true">↗</span></a><button id="logout" class="secondary" hidden>Abmelden</button></div></div></header>
<main><p id="notice" role="status"></p>
<form id="login" hidden>
<div class="jacket" aria-hidden="true"><div class="orbit"></div><div class="books-art"><img class="jacket-back" src="/assets/book-cover.webp" alt=""><img class="jacket-front" src="/assets/maggie-cover.webp" alt=""></div></div>
<div class="sign-in"><h1>Adminzugang</h1><p class="intro">Melde dich an, um Bücher, Cover und Redaktionszugänge zu verwalten.</p>
<label for="username">Benutzername</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
<label for="password">Passwort</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="reveal" aria-controls="password" aria-pressed="false">Anzeigen</button></div>
<button class="login-submit">Anmelden <span aria-hidden="true">→</span></button></div></form>
<div id="panel" hidden><h1>Websiteverwaltung</h1><nav class="section-switch" aria-label="Verwaltungsbereiche"><button type="button" data-view="program" aria-controls="program" aria-pressed="true">Buchprogramm</button><button type="button" data-view="accounts" aria-controls="accounts" aria-pressed="false">Zugänge</button></nav>
<section id="program"><h2>Buchprogramm</h2>
<details id="new-book"><summary>Neues Buch hinzufügen</summary>
<form id="newbook"><label>Titel<input name="title" maxlength="160" required></label><label>Untertitel (optional)<input name="subtitle" maxlength="240"></label><label>Status<input name="status" value="In Entwicklung" maxlength="80" required></label><label>Beschreibung<textarea name="description" rows="4" maxlength="1600" required></textarea></label><label>Cover (optional)<input name="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button>Buch veröffentlichen</button></form></details><label>Buch auswählen<select id="book"></select></label><div class="columns"><form id="cover"><h3>Buchcover</h3><div class="preview-stage"><img id="preview" alt="Aktuelles Buchcover"></div><label>Neues Cover<input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Cover veröffentlichen</button><button type="button" class="secondary" id="restore">Originalcover verwenden</button></form><form id="details"><h3>Buchdetails</h3><label id="edit-title" hidden>Titel<input name="title" maxlength="160"></label><label>Status<input name="status" maxlength="80" required></label><label>Untertitel<input name="subtitle" maxlength="240"></label><label>Beschreibung<textarea name="description" rows="7" maxlength="1600" required></textarea></label><button>Buchtext veröffentlichen</button></form></div></section>
<div id="accounts" hidden><section><h2>Blog Creator</h2><p>Redaktionskonto <strong id="editor"></strong></p><form id="reset"><label>Neues Redaktionspasswort (mindestens 16 Zeichen)<input name="password" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Passwort wiederholen<input name="repeat" type="password" autocomplete="new-password" required></label><button>Passwort setzen und Redaktion abmelden</button></form></section>
<section><h2>Mein Adminpasswort</h2><form id="self"><label>Bisheriges Passwort<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>Neues Passwort<input name="password" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Passwort wiederholen<input name="repeat" type="password" autocomplete="new-password" required></label><button>Adminpasswort ändern</button></form></section></div></div><footer><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a></footer></main></body></html>

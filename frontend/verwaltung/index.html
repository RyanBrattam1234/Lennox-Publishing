<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Verwaltung · Lennox Publishing</title><link rel="stylesheet" href="/verwaltung/admin.css"><script type="module" src="/verwaltung/admin.js"></script></head><body>
<header><a href="/">Lennox Publishing</a><button id="logout" hidden>Abmelden</button></header><main><h1>Websiteverwaltung</h1><p id="notice" role="status"></p>
<form id="login" hidden><h2>Adminzugang</h2><label>Benutzername<input name="username" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form>
<div id="panel" hidden><section><h2>Buchprogramm</h2><label>Buch auswählen<select id="book"></select></label><div class="columns"><form id="cover"><img id="preview" alt="Aktuelles Buchcover"><label>Neues Cover<input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Cover veröffentlichen</button><button type="button" class="secondary" id="restore">Originalcover verwenden</button></form><form id="details"><label>Status<input name="status" maxlength="80" required></label><label>Untertitel<input name="subtitle" maxlength="240" required></label><label>Beschreibung<textarea name="description" rows="7" maxlength="1600" required></textarea></label><button>Buchtext veröffentlichen</button></form></div></section>
<section><h2>Blog Creator</h2><p>Redaktionskonto <strong id="editor"></strong></p><form id="reset"><label>Neues Redaktionspasswort (mindestens 16 Zeichen)<input name="password" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Passwort wiederholen<input name="repeat" type="password" autocomplete="new-password" required></label><button>Passwort setzen und Redaktion abmelden</button></form></section>
<section><h2>Mein Adminpasswort</h2><form id="self"><label>Bisheriges Passwort<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>Neues Passwort<input name="password" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Passwort wiederholen<input name="repeat" type="password" autocomplete="new-password" required></label><button>Adminpasswort ändern</button></form></section></div><footer><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></footer></main></body></html>
